<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseases & Conditions</title>

<!-- Bootstrap 5 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --brand-blue-dark: #001e5c;
    --brand-blue: #0b3fa0;
    --brand-blue-light: #1450c4;
  }

  body{
    font-family: 'Inter', sans-serif;
  }

  .hero-section{
    background: linear-gradient(135deg, var(--brand-blue-light) 0%, var(--brand-blue) 45%, var(--brand-blue-dark) 100%);
    color: #fff;
    padding: 2rem 0 3rem;
  }

  /* Breadcrumb */
  .hero-breadcrumb .breadcrumb{
    margin-bottom: 0;
  }
  .hero-breadcrumb .breadcrumb-item,
  .hero-breadcrumb .breadcrumb-item a{
    color: rgba(255,255,255,0.85);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .hero-breadcrumb .breadcrumb-item.active{
    color: #fff;
    font-weight: 500;
  }
  .hero-breadcrumb .breadcrumb-item + .breadcrumb-item::before{
    content: ">";
    color: rgba(255,255,255,0.6);
    font-family: sans-serif;
  }

  /* Title */
  .hero-title{
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 2.75rem;
    line-height: 1.15;
    margin-top: 1.5rem;
  }
  .hero-subtitle{
    font-size: 1.1rem;
    color: rgba(255,255,255,0.9);
    margin-top: 0.75rem;
  }

  /* Search */
  .search-label{
    font-weight: 600;
    font-size: 1rem;
    margin-top: 2rem;
    margin-bottom: 0.75rem;
  }
  .search-box{
    background: #fff;
    border-radius: 50px;
    padding: 0.65rem 1.25rem;
    max-width: 480px;
  }
  .search-box input{
    border: none;
    outline: none;
    width: 100%;
    font-size: 1rem;
  }
  .search-box input::placeholder{
    color: #6c757d;
  }
  .search-box .bi,
  .search-box svg{
    color: #212529;
    flex-shrink: 0;
  }

  /* Letter grid */
  .letter-panel-label{
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  .letter-grid{
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0.6rem;
    max-width: 460px;
  }
  .letter-btn{
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .letter-btn:hover{
    background: rgba(255,255,255,0.25);
    color: #fff;
    transform: translateY(-1px);
  }
  .letter-btn.active{
    background: #fff;
    color: var(--brand-blue-dark);
  }

  /* Responsive tweaks */
  @media (max-width: 767.98px){
    .hero-title{
      font-size: 2rem;
    }
    .letter-grid{
      grid-template-columns: repeat(6, 1fr);
      max-width: 100%;
    }
    .letter-panel-label{
      margin-top: 2.5rem;
    }
  }

  @media (min-width: 768px) and (max-width: 991.98px){
    .letter-grid{
      grid-template-columns: repeat(7, 1fr);
    }
  }

  @media (min-width: 1200px){
    .hero-title{
      font-size: 3.25rem;
    }
    .letter-grid{
      grid-template-columns: repeat(8, 1fr);
      gap: 0.75rem;
    }
    .letter-btn{
      font-size: 1.05rem;
    }
  }
</style>
</head>
<body>

<section class="hero-section">
  <div class="container">

    <!-- Breadcrumb -->
    <nav class="hero-breadcrumb" aria-label="breadcrumb">
      <ol class="breadcrumb flex-wrap">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Diseases &amp; Conditions</a></li>
        <li class="breadcrumb-item active" aria-current="page">Begins with 'A'</li>
      </ol>
    </nav>

    <div class="row">
      <!-- Kolom kiri: Judul, subjudul, search -->
      <div class="col-12 col-lg-6">
        <h1 class="hero-title">Diseases &amp; Conditions</h1>
        <p class="hero-subtitle">Easy-to-understand answers about diseases and conditions</p>

        <p class="search-label">Search diseases &amp; conditions</p>
        <div class="search-box d-flex align-items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
          </svg>
          <input type="text" placeholder="Search">
        </div>
      </div>

      <!-- Kolom kanan: Grid huruf A-Z -->
      <div class="col-12 col-lg-6 mt-4 mt-lg-0 d-flex flex-column align-items-start align-items-lg-end">
        <div class="letter-panel-label">Find diseases &amp; conditions by first letter</div>
        <div class="letter-grid">
          <a href="#" class="letter-btn active">A</a>
          <a href="#" class="letter-btn">B</a>
          <a href="#" class="letter-btn">C</a>
          <a href="#" class="letter-btn">D</a>
          <a href="#" class="letter-btn">E</a>
          <a href="#" class="letter-btn">F</a>
          <a href="#" class="letter-btn">G</a>
          <a href="#" class="letter-btn">H</a>
          <a href="#" class="letter-btn">I</a>
          <a href="#" class="letter-btn">J</a>
          <a href="#" class="letter-btn">K</a>
          <a href="#" class="letter-btn">L</a>
          <a href="#" class="letter-btn">M</a>
          <a href="#" class="letter-btn">N</a>
          <a href="#" class="letter-btn">O</a>
          <a href="#" class="letter-btn">P</a>
          <a href="#" class="letter-btn">Q</a>
          <a href="#" class="letter-btn">R</a>
          <a href="#" class="letter-btn">S</a>
          <a href="#" class="letter-btn">T</a>
          <a href="#" class="letter-btn">U</a>
          <a href="#" class="letter-btn">V</a>
          <a href="#" class="letter-btn">W</a>
          <a href="#" class="letter-btn">X</a>
          <a href="#" class="letter-btn">Y</a>
          <a href="#" class="letter-btn">Z</a>
          <a href="#" class="letter-btn">#</a>
        </div>
      </div>
    </div>

  </div>
</section>

</body>
</html>
